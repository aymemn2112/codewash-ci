name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CodeWashGame

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: CodeWashGame/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch base branch for patch coverage
        run: git fetch --no-tags origin "${{ github.base_ref || 'develop' }}:refs/remotes/origin/${{ github.base_ref || 'develop' }}"

      - name: Lint (ESLint, static analysis)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Run tests with coverage
        run: npm run coverage

      - name: Patch coverage (80% of changed lines)
        run: npm run coverage:patch
        env:
          BASE_REF: origin/${{ github.base_ref || 'develop' }}
          PATCH_COVERAGE_THRESHOLD: '80'
          LCOV_PATH: coverage/lcov.info

      - name: Build production bundle
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: CodeWashGame/coverage/lcov-report
          if-no-files-found: ignore

      - name: Audit dependencies (report-only)
        run: npm audit --audit-level=critical
        continue-on-error: true